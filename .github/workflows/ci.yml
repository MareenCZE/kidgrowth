name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ["8.1", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo_sqlite

      - name: Lint every PHP file
        run: |
          set -e
          find . -name '*.php' -not -path './.git/*' -print0 \
            | xargs -0 -n1 php -l

      - name: Test suite (includes the no-personal-data guard)
        # The denylist of personal tokens is never stored in this public
        # repository. It comes from a repository secret, which is empty for
        # pull requests from forks - the guard then runs its structural
        # checks only, rather than failing on a list a contributor cannot have.
        env:
          KIDGROWTH_DENYLIST: ${{ secrets.PII_DENYLIST }}
        run: php tests/run.php
